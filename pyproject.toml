[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-achievement-unlocker"
version = "0.1.0"
description = "A cautious, local Factorio achievement patcher for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Factorio Achievement Unlocker contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
factorio-achievement-unlocker = "factorio_achievement_unlocker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/factorio-achievement-unlocker" = [
  "ATTRIBUTION.md",
  "README.ru.md",
  "third_party/FAE_Linux-LICENSE",
  "third_party/FactorioAchievementEnabler-LICENSE",
]
